name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  solidity:
    name: Solidity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telebuzzy-solidity
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv

      - name: Check frontend ABI is up to date
        run: |
          ./scripts/export-abi.sh
          git diff --exit-code -- ../telebuzzy-frontend/src/config/web3/abi.ts \
            || (echo "::error::abi.ts is stale. Run 'pnpm abi:export' and commit." && exit 1)
